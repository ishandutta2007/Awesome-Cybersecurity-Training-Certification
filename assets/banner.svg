<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05d550" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -20px); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-25px, 25px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(420px); }
      }
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #00f2fe); }
        50% { filter: drop-shadow(0 0 20px #00f2fe); }
      }
      .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: floatOrb2 8s ease-in-out infinite; transform-origin: center; }
      .scanner { animation: scanline 7s linear infinite; }
      .shield-icon { animation: shieldPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Matrix Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Ambient Orbs (Background only) -->
  <g class="orb-1" opacity="0.4">
    <circle cx="150" cy="100" r="130" fill="#7928ca" filter="url(#glow)" />
  </g>
  <g class="orb-2" opacity="0.35">
    <circle cx="1050" cy="300" r="160" fill="#00f2fe" filter="url(#glow)" />
  </g>
  <g opacity="0.25">
    <circle cx="920" cy="80" r="90" fill="#ff0080" filter="url(#glow)" />
  </g>

  <!-- Scanning Matrix Light Line (Subtle background sweep) -->
  <g class="scanner" opacity="0.25">
    <rect x="0" y="0" width="1200" height="2" fill="url(#cyberCyan)" />
  </g>

  <!-- Left Side: Interactive Shield Emblem / Icon -->
  <g class="shield-icon" transform="translate(85, 115)">
    <!-- Outer Shield Hex -->
    <path d="M 90 20 L 160 55 L 160 140 C 160 195 90 235 90 235 C 90 235 20 195 20 140 L 20 55 Z" 
          fill="rgba(11, 19, 43, 0.75)" stroke="url(#cyberCyan)" stroke-width="3" />
    <!-- Inner Shield Accent -->
    <path d="M 90 38 L 146 66 L 146 136 C 146 180 90 214 90 214 C 90 214 34 180 34 136 L 34 66 Z" 
          fill="none" stroke="url(#accentPurple)" stroke-width="2" opacity="0.8" />
    <!-- Lock & Terminal Symbol -->
    <path d="M 75 105 L 75 90 C 75 81.7 81.7 75 90 75 C 98.3 75 105 81.7 105 90 L 105 105" 
          fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
    <rect x="68" y="105" width="44" height="34" rx="6" fill="#00f2fe" />
    <circle cx="90" cy="120" r="4" fill="#070b19" />
    <path d="M 90 124 L 90 131" stroke="#070b19" stroke-width="3" stroke-linecap="round" />
    <!-- Binary / Tech Accents around Shield -->
    <circle cx="160" cy="55" r="4" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="20" cy="55" r="4" fill="#ff0080" filter="url(#softGlow)" />
    <circle cx="90" cy="235" r="4" fill="#05d550" filter="url(#softGlow)" />
  </g>

  <!-- Center-Right: Foreground Titles & Subtitles (Always clear and on top) -->
  <g transform="translate(300, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="70" width="380" height="32" rx="16" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <circle cx="16" cy="86" r="5" fill="#05d550" filter="url(#softGlow)" />
    <text x="32" y="91" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      CURATED DIRECTORY &#8226; CTF &#8226; SAAS &#8226; OPEN-SOURCE
    </text>

    <!-- Main Title -->
    <text x="0" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      Awesome Cybersecurity
    </text>
    <text x="0" y="200" fill="url(#cyberCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      Training &amp; Certification
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="244" fill="#c4cbe2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      The authoritative guide to hands-on security labs, industry certifications,
    </text>
    <text x="0" y="268" fill="#8d99ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      vulnerable-by-design practice targets, and self-hosted CTF infrastructure.
    </text>

    <!-- Highlight Feature Badges / Interactive Pills -->
    <g transform="translate(0, 305)">
      <!-- Pill 1: CTF & Practice Labs -->
      <g>
        <rect x="0" y="0" width="160" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Hands-On Labs</text>
      </g>
      <!-- Pill 2: Industry Certifications -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="180" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏆 Certification Paths</text>
      </g>
      <!-- Pill 3: Self-Hosted CTF -->
      <g transform="translate(364, 0)">
        <rect x="0" y="0" width="175" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source CTF</text>
      </g>
      <!-- Pill 4: Pricing Transparency -->
      <g transform="translate(551, 0)">
        <rect x="0" y="0" width="195" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💎 Transparent Pricing</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" />
</svg>